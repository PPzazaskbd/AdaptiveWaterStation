server {
    listen 80;
    server_name api.embed-project.thiraphatpp.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.embed-project.thiraphatpp.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.embed-project.thiraphatpp.com;

    ssl_certificate /etc/letsencrypt/live/embedded-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/embedded-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
